@if(isLoading$ | async) {
<app-loading />
} @else {
@if((data$ | async)?.length === 0) {
<div>
  <button (click)="createNewStructure()">Create New Structure</button>
</div>
} @else {
<div class="a-home-content">
  @if(selectedStructure$ | async; as structure) {
    <app-svg-pallet class="a-svg-container" [dataItem]="structure"></app-svg-pallet>
  } @else {
    <div class="a-svg-container">
      <span class="a-empty-message">Виберіть структуру для відображення</span>
    </div>
  }
  <app-list class="a-list" [items]="(data$ | async) || []" [selectedItem]="selectedStructure$ | async" (onAdd)="createNewStructure()"
    (itemClick)="onSelectStructure($event)"></app-list>
</div>

}

@if (showDialog) {
<div class="dialog-overlay">
  <form class="dialog" [formGroup]="newStructureForm">
    <h2>Створити нову структуру</h2>
    <input type="text" formControlName="name" placeholder="Назва структури" />
    <div class="dialog-actions">
      <button type="submit" (click)="createStructure()">Створити</button>
      <button (click)="showDialog = false">Скасувати</button>
    </div>
  </form>
</div>
}
