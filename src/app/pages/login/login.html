<img class="a-logo" src="/logo.svg" alt="AMBL Logo">
<form class="a-form-container" [formGroup]="loginForm" (ngSubmit)="onLogin()">

  <div class="a-field m-top-auto">
    <label class="a-field-label" for="identity">Username:</label>
    <input class="a-field-input" type="text" formControlName="identity" id="identity">
  </div>

  <div class="a-field">
    <label class="a-field-label" for="password">Password:</label>
    <input class="a-field-input" [type]="showPassword ? 'text' : 'password'" formControlName="password" id="password">
    <span (click)="onShowPasswordToggle()">X</span>
  </div>


  <p class="a-error-msg">
    @if ((error$ | async); as err) {
    <span>{{ err }}</span>
    }
  </p>


  <button class="a-button m-bottom-auto" type="submit" [disabled]="loginForm.invalid || (isLoading$ | async)">
    {{ (isLoading$ | async) ? 'Loading...' : 'Sign In' }}
  </button>



</form>
