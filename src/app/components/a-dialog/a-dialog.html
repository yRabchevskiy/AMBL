<p-dialog [header]="label" [modal]="true" [(visible)]="visible" [closable]="false" [style]="{ width: '25rem' }">
  <ng-content select="[aDialogBody]"></ng-content>
  <div class="a-dialog-footer">
    <button class="a-button-secondary" type="button" (click)="closeDialog()" label="Save">Close</button>
    <button class="a-button" type="button" (click)="saveData()">Save</button>
  </div>
</p-dialog>
