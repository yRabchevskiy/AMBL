<svg:rect x="0" y="0" width="0.1" height="0.05" rx="0.005" fill="var(--a-white)" stroke="var(--a-gray-medium)"
  stroke-width="0.001" filter="url(#dropShadow)">
</svg:rect>

<svg:g transform="translate(0.096, 0)" class="action-buttons-container">
  <svg:g class="svg-button" style="cursor: pointer;" (click)="$event.stopPropagation()">
    <svg:rect x="0" y="0.004" width="0.008" height="0.008" rx="0.001" fill="var(--a-black)"
      stroke="var(--a-accent-red)" stroke-width="0.0005">
      <svg:title>Add Union</svg:title>
    </svg:rect>
    <svg:text x="0.004" y="0.0105" font-size="0.008" font-weight="bold" fill="var(--a-accent-red)" text-anchor="middle">
      +
    </svg:text>
  </svg:g>

  <svg:g class="svg-button" style="cursor: pointer;" (click)="$event.stopPropagation()">
    <svg:rect x="0" y="0.016" width="0.008" height="0.008" rx="0.001" fill="var(--a-black)"
      stroke="var(--a-accent-red)" stroke-width="0.0005">
      <svg:title>Add Position</svg:title>
    </svg:rect>
    <svg:text x="0.004" y="0.0225" font-size="0.008" font-weight="bold" fill="var(--a-accent-red)" text-anchor="middle">
      P
    </svg:text>
  </svg:g>

  <svg:g class="svg-button" style="cursor: pointer;" (click)="$event.stopPropagation()">
    <svg:rect x="0" y="0.028" width="0.008" height="0.008" rx="0.001" fill="var(--a-black)"
      stroke="var(--a-accent-red)" stroke-width="0.0005">
      <svg:title>Remove union</svg:title>
    </svg:rect>
    <svg:text x="0.004" y="0.0345" font-size="0.008" font-weight="bold" fill="var(--a-accent-red)" text-anchor="middle">
      ×
    </svg:text>
  </svg:g>
</svg:g>

<svg:text x="0.045" y="0.028" text-anchor="middle" font-size="0.01" font-weight="bold" fill="var(--a-black)">
  {{ union.name }}
</svg:text>
